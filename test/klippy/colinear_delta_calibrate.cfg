# Test config for COLINEAR_DELTA_CALIBRATE (colinear delta / dual-delta)
[stepper_a]
step_pin: 1
dir_pin: 2
enable_pin: !3
microsteps: 16
rotation_distance: 40
endstop_pin: ^4
homing_speed: 50
position_endstop: 300
arm_length: 215

[stepper_b]
step_pin: 5
dir_pin: 6
enable_pin: !7
microsteps: 16
rotation_distance: 40
endstop_pin: ^8

[stepper_c]
step_pin: 9
dir_pin: 10
enable_pin: !11
microsteps: 16
rotation_distance: 40
endstop_pin: ^12

[stepper_d]
step_pin: 13
dir_pin: 14
enable_pin: !15
microsteps: 16
rotation_distance: 40
endstop_pin: ^16
position_endstop: 300
arm_length: 215

[stepper_e]
step_pin: 17
dir_pin: 18
enable_pin: !19
microsteps: 16
rotation_distance: 40
endstop_pin: ^20

[stepper_f]
step_pin: 21
dir_pin: 22
enable_pin: !23
microsteps: 16
rotation_distance: 40
endstop_pin: ^24

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: colinear_delta
max_velocity: 300
max_accel: 3000
delta_radius: 100
print_radius: 90
motion_split: 0.5
secondary_rotation: 180

[colinear_delta_calibrate]
radius: 60
