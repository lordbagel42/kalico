# Test config for ODrive v3.6 support
[odrive drive0]
serial: /dev/ttyODRIVE0

[odrive_axis x_motor]
odrive: drive0
axis: 0
pole_pairs: 7
torque_constant: 0.0827
encoder_cpr: 8192

[stepper_x]
odrive_axis: x_motor
rotation_distance: 40
endstop_pin: odrive_axis_x_motor:virtual_endstop
position_endstop: 0
position_max: 200
homing_speed: 5

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
