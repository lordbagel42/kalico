# Test config for chamber_led (Particle Boron USB-serial RGB LED)
# support
[chamber_led chamber]
serial: /dev/ttyCHAMBERLED0
color_printing: 0,255,0
color_paused: 255,255,0
color_complete: 0,0,255,128
color_error: 255,0,0
color_idle: 0,0,0

[display_template dtest]
param_myvar: 1.2
text: { param_myvar }, { param_myvar / 2.0 }, 0.0, 2.0

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
